services:
    core:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - rabbitmq
        healthcheck:
            test:
                - CMD
                - curl
                - '-f'
                - 'http://localhost/up'
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        labels:
            traefik.enable: 'true'
            traefik.http.routers.core.rule: 'Host(`${APP_DOMAIN}`)'
            traefik.http.routers.core.entrypoints: 'websecure'
            traefik.http.routers.core.tls: 'true'
            traefik.http.services.core.loadbalancer.server.port: '80'
    pgsql:
        image: 'postgres:18-alpine'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    rabbitmq:
        image: 'rabbitmq:4-management-alpine'
        hostname: 'rabbitmq'
        environment:
            RABBITMQ_HOST: '%'
            RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER}'
            RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD}'
            RABBITMQ_DEFAULT_VHOST: '${RABBITMQ_VHOST:-/}'
        volumes:
            - 'sail-rabbitmq:/var/lib/rabbitmq'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - rabbitmq-diagnostics
                - '-q'
                - ping
            retries: 3
            timeout: 5s
    traefik:
        image: 'traefik:v3.6'
        command:
            - '--configFile=/etc/traefik/traefik.yml'
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - './docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro'
            - '/var/run/docker.sock:/var/run/docker.sock:ro'
            - 'traefik-certs:/letsencrypt'
        networks:
            - sail
        depends_on:
            - core
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-rabbitmq:
        driver: local
    traefik-certs:
        driver: local
